
# apps whose config files arr-seed pre-writes; they must wait for it
x-seeded: &seeded
  depends_on:
    arr-seed:
      condition: service_completed_successfully

x-bootstrap: &bootstrap
  image: python:3-alpine
  env_file: .env
  volumes:
    - ${CONFIG_ROOT}:/config
    - ./setup:/setup:ro
  restart: "no"

services:
  arr-seed:
    <<: *bootstrap
    container_name: arr-seed
    command: python /setup/bootstrap.py seed

  arr-setup:
    <<: *bootstrap
    container_name: arr-setup
    command: python /setup/bootstrap.py
    volumes:
      - ${CONFIG_ROOT}:/config
      - ./setup:/setup:ro
      - /var/run/docker.sock:/var/run/docker.sock  # removes arr-seed and itself when done
    depends_on: [qbittorrent, sonarr, radarr, lidarr, prowlarr, flaresolverr, bazarr, emby, seerr]

  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    environment:
      - TZ=${TZ}
      - HOSTNAME=0.0.0.0  # Next.js binds to $HOSTNAME; the container id makes the localhost healthcheck fail
    volumes:
      - ${CONFIG_ROOT}/homarr/config:/app/data/config
      - ${CONFIG_ROOT}/homarr/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${HOMARR_PORT}:7575
    restart: unless-stopped

  sonarr:
    <<: *seeded
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_TV_DIR}:/tv
      - ${DOWNLOADS_ROOT}:/downloads
    ports:
      - ${SONARR_PORT}:8989
    restart: unless-stopped

  radarr:
    <<: *seeded
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_MOVIES_DIR}:/movies
      - ${DOWNLOADS_ROOT}:/downloads
    ports:
      - ${RADARR_PORT}:7878
    restart: unless-stopped

  lidarr:
    <<: *seeded
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${MEDIA_MUSIC_DIR}:/music
      - ${DOWNLOADS_ROOT}:/downloads
    ports:
      - ${LIDARR_PORT}:8686
    restart: unless-stopped

  prowlarr:
    <<: *seeded
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT}:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  bazarr:
    <<: *seeded
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_MOVIES_DIR}:/movies
      - ${MEDIA_TV_DIR}:/tv
    ports:
      - ${BAZARR_PORT}:6767
    restart: unless-stopped

  qbittorrent:
    <<: *seeded
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DOWNLOADS_ROOT}:/downloads
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
      - ${QBITTORRENT_BT_PORT}:6881
      - ${QBITTORRENT_BT_PORT}:6881/udp
    restart: unless-stopped

  emby:
    image: lscr.io/linuxserver/emby:latest
    container_name: emby
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/emby:/config
      - ${MEDIA_MOVIES_DIR}:/movies
      - ${MEDIA_TV_DIR}:/tv
      - ${MEDIA_MUSIC_DIR}:/music
    ports:
      - ${EMBY_HTTP_PORT}:8096
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - ${SEERR_PORT}:5055
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      - TZ=${TZ}
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --include-restarting --schedule "0 30 4 * * *"
    restart: unless-stopped
